<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Nimbus — Settings</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Roboto, Arial; padding: 20px; color: #0d1b2a; max-width: 560px; margin: 0 auto; line-height: 1.5; }
    h2 { color: #05007f; margin-bottom: 20px; font-size: 1.5rem; }
    h3 { color: #05007f; margin-bottom: 12px; font-size: 1.1rem; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
    input[type="text"], textarea, select, input[type="number"] { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-top: 4px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1f7fff; box-shadow: 0 0 0 2px rgba(31, 127, 255, 0.2); }
    button { margin-top: 12px; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s; }
    .hint { font-size: 12px; color: #64748b; margin-top: 6px; }
    #status { margin-top: 12px; padding: 10px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; }
    #subscription-info, #account-info { border-radius: 8px; border: 1px solid #e2e8f0; }
    #save, #cancel-btn, #resubscribe-btn { background: #05007f; color: white; border: none; }
    #save:hover, #resubscribe-btn:hover { background: #1f7fff; }
    #cancel-btn:hover { background: #d97706; }
    #signout-btn:hover, #refund-btn:hover { background: rgba(185,28,28,0.08); border-color: rgba(185,28,28,0.7); }
    #simple-signout-btn:hover { background: #475569; }
  </style>
</head>
<body>
  <h2>Nimbus — Settings</h2>

  <label>OpenAI API Key (Optional)</label>
  <input id="apiKey" type="text" placeholder="sk-..." />
  <div class="hint">We store the key locally in your browser. If not provided, we'll use a free dictionary API.</div>
  
  <label style="margin-top: 16px;">
    <input type="checkbox" id="useFreeAPI" style="width: auto; margin-right: 8px;" />
    Use free dictionary API (works without OpenAI key)
  </label>

  <label>Explanation Style</label>
  <select id="style">
    <option value="plain">Plain (everyday)</option>
    <option value="technical">Technical (developer)</option>
    <option value="kid">Explain like I'm 12</option>
  </select>

  <div>
    <button id="save">Save Settings</button>
  </div>

  <div id="subscription-section" style="margin-top: 32px; padding-top: 28px; border-top: 1px solid #e2e8f0; display: none;">
    <h3>Subscription Management</h3>
    <div id="subscription-info" style="margin-bottom: 16px; padding: 14px; background: #f8fafc; font-size: 13px;"></div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <button id="cancel-btn" style="background: #f59e0b; color: white; border: none; display: none;">Cancel Subscription</button>
      <button id="resubscribe-btn" style="background: #05007f; color: white; border: none; display: none;">Resubscribe</button>
      <button id="refund-btn" style="background: transparent; color: #b91c1c; border: 1px solid rgba(185,28,28,0.5); display: none;">Request Refund (7-day window)</button>
    </div>
    <div id="subscription-status" style="margin-top: 14px; font-size: 13px; padding: 8px 0;"></div>
  </div>

  <div id="account-section" style="margin-top: 32px; padding-top: 28px; border-top: 1px solid #e2e8f0;">
    <h3>Account</h3>
    <div id="account-info" style="margin-bottom: 16px; padding: 14px; background: #f8fafc; font-size: 13px;"></div>
    <button id="signout-btn" style="background: transparent; color: #b91c1c; border: 1px solid rgba(185,28,28,0.5); padding: 10px 18px;">Sign Out</button>
    <div class="hint" style="margin-top: 8px;">Signing out will clear your account and subscription data. You'll need to sign in again to use premium features.</div>
  </div>
  
  <div id="status" style="margin-top: 12px;"></div>

  <div style="margin-top: 48px; padding: 32px 24px; border-top: 1px solid #e2e8f0; background: #f8fafc; text-align: center; border-radius: 10px;">
    <button id="simple-signout-btn" style="background: #64748b; color: white; padding: 12px 28px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; min-width: 140px;">Sign Out</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
